name: E2E flake fix verification (temporary, do not merge)

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        shell: bash
        run: npm ci
      - name: Install Chromium and Linux dependencies
        shell: bash
        run: npm exec --workspace @build-manager/web -- playwright install --with-deps chromium
      - name: Build Web
        shell: bash
        run: npm run build:web
      - name: Core suite twice in suite order
        env:
          BUILD_MANAGER_E2E_PREBUILT: "1"
        shell: bash
        run: |
          for i in 1 2; do npm run test:e2e:core || echo "CORE_SUITE_RUN_${i}_FAILED"; done
      - name: Outcome permission-loss tests repeated
        env:
          BUILD_MANAGER_E2E_PREBUILT: "1"
        shell: bash
        run: npm run test:e2e:core -- --grep "outcome permission loss" --repeat-each 15 || echo "OUTCOME_REPEAT_FAILED"
      - name: Conversation denied-receipt tests repeated
        env:
          BUILD_MANAGER_E2E_PREBUILT: "1"
        shell: bash
        run: npm run test:e2e:core -- --grep "denied receipt" --repeat-each 15 || echo "CONVERSATION_REPEAT_FAILED"
      - name: Hero B first test on fresh servers
        env:
          BUILD_MANAGER_E2E_PREBUILT: "1"
        shell: bash
        working-directory: apps/web
        run: |
          fails=0
          for i in $(seq 1 15); do
            npx playwright test tests/e2e/cross-platform-hero-b.spec.ts --reporter=list || fails=$((fails+1))
          done
          echo "HERO_B_FAILS=$fails/15"
      - name: Web suite once in suite order
        env:
          BUILD_MANAGER_E2E_PREBUILT: "1"
        shell: bash
        run: npm run test:e2e:web || echo "WEB_SUITE_FAILED"
